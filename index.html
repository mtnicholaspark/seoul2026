<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Seoul 2026</title>
<meta name="theme-color" content="#eaf3fc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Seoul 2026">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" crossorigin="">
</head>
<body>

<header class="app-header">
  <div class="app-header-title">
    <span class="app-header-compass" aria-hidden="true">✦</span>
    <h1>Seoul 2026</h1>
  </div>
  <span id="sync-indicator" class="sync-indicator" title="Firestore sync status">●</span>
</header>

<main id="tab-panels">
  <section id="calendar-tab" class="tab-panel" aria-labelledby="nav-calendar"></section>
  <section id="wishlist-tab" class="tab-panel" hidden aria-labelledby="nav-wishlist"></section>
  <section id="nearby-tab" class="tab-panel" hidden aria-labelledby="nav-nearby"></section>
  <section id="ideas-tab" class="tab-panel" hidden aria-labelledby="nav-ideas"></section>
</main>

<nav class="tab-bar">
  <button id="nav-calendar" class="tab-btn active" data-tab="calendar">
    <span class="tab-icon">📅</span><span>Calendar</span>
  </button>
  <button id="nav-wishlist" class="tab-btn" data-tab="wishlist">
    <span class="tab-icon">⭐</span><span>Wishlist</span>
  </button>
  <button id="nav-nearby" class="tab-btn" data-tab="nearby">
    <span class="tab-icon">📍</span><span>Nearby</span>
  </button>
  <button id="nav-ideas" class="tab-btn" data-tab="ideas">
    <span class="tab-icon">🧭</span><span>Itinerary Idea</span>
  </button>
</nav>

<div id="modal-root"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js" crossorigin=""></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.20/leaflet-maplibre-gl.js" crossorigin=""></script>
<script type="module" src="app.js"></script>
</body>
</html>
